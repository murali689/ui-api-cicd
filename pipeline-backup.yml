name: Task Management CI/CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # Detects which part(s) of the repo changed: UI/, API/, or both.
  # ---------------------------------------------------------------------
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      ui_changed: ${{ steps.filter.outputs.ui }}
      api_changed: ${{ steps.filter.outputs.api }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ui:
              - 'UI/**'
            api:
              - 'API/**'

  # ---------------------------------------------------------------------
  # Build UI (React + Vite) - only runs when UI/ changed
  # ---------------------------------------------------------------------
  build-ui:
    name: Build UI
    needs: detect-changes
    if: needs.detect-changes.outputs.ui_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: UI/package-lock.json

      - name: Install dependencies
        working-directory: UI
        run: npm install

      - name: Build UI
        working-directory: UI
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Upload UI build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-build
          path: UI/dist

  # ---------------------------------------------------------------------
  # Build API (Spring Boot + Maven) - only runs when API/ changed
  # ---------------------------------------------------------------------
  build-api:
    name: Build API
    needs: detect-changes
    if: needs.detect-changes.outputs.api_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build API
        working-directory: API
        run: mvn clean package -DskipTests

      - name: Upload API build artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-build
          path: API/target/api.jar

  # ---------------------------------------------------------------------
  # Deploy UI to Azure App Service - only runs if Build UI succeeded
  # ---------------------------------------------------------------------
  deploy-ui:
    name: Deploy UI
    needs: [detect-changes, build-ui]
    if: needs.detect-changes.outputs.ui_changed == 'true' && needs.build-ui.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download UI build artifact
        uses: actions/download-artifact@v4
        with:
          name: ui-build
          path: dist

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service (UI)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_UI_APP_NAME }}
          package: dist

  # ---------------------------------------------------------------------
  # Deploy API to Azure App Service - only runs if Build API succeeded
  # ---------------------------------------------------------------------
  deploy-api:
    name: Deploy API
    needs: [detect-changes, build-api]
    if: needs.detect-changes.outputs.api_changed == 'true' && needs.build-api.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download API build artifact
        uses: actions/download-artifact@v4
        with:
          name: api-build
          path: api-artifact

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service (API)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_API_APP_NAME }}
          package: api-artifact/api.jar